<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Details</title>
</head>
<body>

    <h1>TRAINER DETAILS</h1>

    <!-- Form to insert trainer details into the database -->
    <form method="POST" action="/trainer_create">
        <label for="t_id">Trainer ID (t_id):</label><br>
        <input type="number" id="t_id" name="t_id" required><br><br>

        <label for="fname">First Name (fname):</label><br>
        <input type="text" id="fname" name="fname" maxlength="255" required><br><br>

        <label for="lname">Last Name (lname):</label><br>
        <input type="text" id="lname" name="lname" maxlength="255" required><br><br>

        <label for="designation">Designation (designation):</label><br>
        <input type="text" id="designation" name="designation" maxlength="255" required><br><br>

        <label for="username">Username (username):</label><br>
        <input type="text" id="username" name="username" maxlength="255" required><br><br>

        <label for="password">Password (password):</label><br>
        <input type="password" id="password" name="password" maxlength="255" required><br><br>

        <label for="salary">Salary (salary):</label><br>
        <input type="number" id="salary" name="salary" required><br><br>

        <label for="join_date">Join Date (join_date):</label><br>
        <input type="datetime-local" id="join_date" name="join_date" required><br><br>

        <label for="email">Email (email):</label><br>
        <input type="email" id="email" name="email" maxlength="255" required><br><br>

        <button type="submit">Submit Trainer Details</button>
    </form>

</body>
</html>
