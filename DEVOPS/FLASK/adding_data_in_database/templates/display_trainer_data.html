<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Data</title>
</head>
<body>

    <h1>Trainer Data</h1>

    <!-- Table to display trainer details -->
    <table border="1">
        <thead>
            <tr>
                <th>Trainer ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Designation</th>
                <th>Username</th>
                <th>Password</th>
                <th>Salary</th>
                <th>Join Date</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            {% for trainer in trainers %}
            <tr>
                <td>{{ trainer[0] }}</td>
                <td>{{ trainer[1] }}</td>
                <td>{{ trainer[2] }}</td>
                <td>{{ trainer[3] }}</td>
                <td>{{ trainer[4] }}</td>
                <td>{{ trainer[5] }}</td>
                <td>{{ trainer[6] }}</td>
                <td>{{ trainer[7] }}</td>
                <td>{{ trainer[8] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
